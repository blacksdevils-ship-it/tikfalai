<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikFalAi</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
<style>
  :root {
    --tik-red: #fe2c55;
    --tik-cyan: #25f4ee;
    --tik-dark: #010101;
    --tik-card: #161616;
    --tik-border: #2a2a2a;
    --muted: #888;
    --text: #fff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--tik-dark);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
  }

  /* PARTICLES */
  #particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    animation: floatUp linear infinite;
    opacity: 0;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-20px) scale(1.2); opacity: 0; }
  }

  /* LAYOUT */
  .app {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
  }

  /* HEADER */
  .header {
    flex-shrink: 0;
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--tik-border);
    background: rgba(1,1,1,0.9);
    backdrop-filter: blur(20px);
    position: relative;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, var(--tik-cyan), var(--tik-red));
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
  }

  .logo-icon::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--tik-cyan), var(--tik-red));
    z-index: -1;
    animation: rotateBorder 3s linear infinite;
  }

  .logo-icon::after {
    content: '';
    position: absolute;
    inset: 1px;
    border-radius: 8px;
    background: var(--tik-dark);
    z-index: -1;
  }

  @keyframes rotateBorder {
    from { filter: hue-rotate(0deg); }
    to { filter: hue-rotate(360deg); }
  }

  .logo-name {
    font-size: 1.2rem;
    font-weight: 900;
    letter-spacing: -0.5px;
  }

  .logo-name span:first-child { color: var(--tik-cyan); }
  .logo-name span:nth-child(2) { color: var(--tik-red); }
  .logo-name span:last-child { color: #fff; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-badge {
    background: var(--tik-red);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .online-count {
    font-size: 0.7rem;
    color: var(--muted);
  }

  /* FAL TYPE SELECTOR */
  .fal-selector {
    flex-shrink: 0;
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    background: rgba(1,1,1,0.8);
  }

  .fal-selector::-webkit-scrollbar { display: none; }

  .fal-btn {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid var(--tik-border);
    background: transparent;
    color: var(--muted);
    font-family: 'Outfit', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .fal-btn.active {
    background: linear-gradient(135deg, var(--tik-cyan), var(--tik-red));
    border-color: transparent;
    color: #fff;
  }

  .fal-btn:not(.active):hover {
    border-color: var(--tik-cyan);
    color: var(--tik-cyan);
  }

  /* MESSAGES */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: #222 transparent;
  }

  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  /* WELCOME CARD */
  .welcome-card {
    background: linear-gradient(135deg, rgba(37,244,238,0.08), rgba(254,44,85,0.08));
    border: 1px solid rgba(37,244,238,0.2);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-bottom: 4px;
    animation: fadeIn 0.5s ease;
  }

  .welcome-emoji {
    font-size: 2.5rem;
    margin-bottom: 10px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .welcome-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 6px;
    background: linear-gradient(90deg, var(--tik-cyan), var(--tik-red));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .welcome-sub {
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.5;
  }

  /* QUICK QUESTIONS */
  .quick-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
    animation: fadeIn 0.6s ease 0.2s both;
  }

  .quick-label {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  .quick-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .quick-pill {
    background: var(--tik-card);
    border: 1px solid var(--tik-border);
    border-radius: 100px;
    padding: 6px 12px;
    font-size: 0.78rem;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Outfit', sans-serif;
  }

  .quick-pill:hover {
    border-color: var(--tik-cyan);
    color: var(--tik-cyan);
    background: rgba(37,244,238,0.05);
  }

  /* MESSAGE BUBBLES */
  .msg-row {
    display: flex;
    gap: 8px;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    background: linear-gradient(135deg, var(--tik-cyan), var(--tik-red));
    margin-top: 2px;
  }

  .avatar.user-av {
    background: linear-gradient(135deg, #7c3aed, var(--tik-red));
  }

  .bubble-wrap {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-width: 75%;
  }

  .msg-row.user .bubble-wrap { align-items: flex-end; }

  .sender-name {
    font-size: 0.65rem;
    color: var(--muted);
    padding: 0 4px;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 0.88rem;
    line-height: 1.5;
    position: relative;
  }

  .bubble.ai {
    background: var(--tik-card);
    border: 1px solid var(--tik-border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .bubble.user {
    background: linear-gradient(135deg, var(--tik-red), #c0006d);
    border-bottom-right-radius: 4px;
    color: #fff;
  }

  .bubble-time {
    font-size: 0.62rem;
    color: var(--muted);
    padding: 0 4px;
  }

  /* TYPING INDICATOR */
  .typing-row { display: flex; gap: 8px; align-items: flex-end; }

  .typing-bubble {
    background: var(--tik-card);
    border: 1px solid var(--tik-border);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    padding: 12px 16px;
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--tik-cyan);
    animation: typingBounce 1.2s ease-in-out infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; background: #a855f7; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; background: var(--tik-red); }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* INPUT AREA */
  .input-area {
    flex-shrink: 0;
    padding: 12px 16px 20px;
    background: rgba(1,1,1,0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--tik-border);
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .input-wrap {
    flex: 1;
    background: var(--tik-card);
    border: 1px solid var(--tik-border);
    border-radius: 24px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.2s;
  }

  .input-wrap:focus-within {
    border-color: var(--tik-cyan);
    box-shadow: 0 0 0 1px rgba(37,244,238,0.2);
  }

  .input-field {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 0.9rem;
    resize: none;
    max-height: 80px;
    line-height: 1.4;
  }

  .input-field::placeholder { color: var(--muted); }

  .send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--tik-cyan), var(--tik-red));
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s, opacity 0.15s;
    box-shadow: 0 4px 15px rgba(254,44,85,0.3);
  }

  .send-btn:hover { transform: scale(1.08); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* BOTTOM NAV */
  .bottom-nav {
    flex-shrink: 0;
    display: flex;
    border-top: 1px solid var(--tik-border);
    background: rgba(1,1,1,0.98);
  }

  .nav-item {
    flex: 1;
    padding: 10px 0 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    transition: color 0.2s;
    color: var(--muted);
  }

  .nav-item.active { color: var(--tik-red); }

  .nav-icon { font-size: 1.2rem; }
  .nav-label { font-size: 0.6rem; font-weight: 600; }

  /* STARS */
  .stars-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.3); }
  }
</style>
</head>
<body>

<div class="stars-bg" id="stars"></div>
<div id="particles"></div>

<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🔮</div>
      <div class="logo-name">
        <span>Tik</span><span>Fal</span><span>Ai</span>
      </div>
    </div>
    <div class="header-right">
      <span class="live-badge">CANLI</span>
      <span class="online-count">🟢 2.4K online</span>
    </div>
  </div>

  <!-- FAL SELECTOR -->
  <div class="fal-selector">
    <button class="fal-btn active" onclick="selectFal(this, 'genel')">✨ Genel Fal</button>
    <button class="fal-btn" onclick="selectFal(this, 'tarot')">🃏 Tarot</button>
    <button class="fal-btn" onclick="selectFal(this, 'astro')">♈ Astroloji</button>
    <button class="fal-btn" onclick="selectFal(this, 'kahve')">☕ Kahve Falı</button>
    <button class="fal-btn" onclick="selectFal(this, 'ask')">💝 Aşk Falı</button>
    <button class="fal-btn" onclick="selectFal(this, 'para')">💰 Para Falı</button>
  </div>

  <!-- MESSAGES -->
  <div class="messages" id="messages">
    <div class="welcome-card">
      <span class="welcome-emoji">🔮</span>
      <div class="welcome-title">TikFalAi'ye Hoş Geldin</div>
      <div class="welcome-sub">Evrenin sırları seninle. Aklındaki soruyu sor, yıldızlar cevaplasın ✨</div>
    </div>

    <div class="quick-wrap">
      <div class="quick-label">✦ Hızlı Sorular</div>
      <div class="quick-pills">
        <button class="quick-pill" onclick="sendQuick(this)">💕 Aşkım ne zaman gelecek?</button>
        <button class="quick-pill" onclick="sendQuick(this)">💼 Kariyer yolum nasıl?</button>
        <button class="quick-pill" onclick="sendQuick(this)">🌙 Bu hafta beni ne bekliyor?</button>
        <button class="quick-pill" onclick="sendQuick(this)">💰 Maddi durumum iyileşecek mi?</button>
        <button class="quick-pill" onclick="sendQuick(this)">🔮 Bana genel fal bak</button>
      </div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-row">
      <div class="input-wrap">
        <textarea class="input-field" id="inputField" placeholder="Sorunuzu yazın..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <div class="nav-icon">🔮</div>
      <div class="nav-label">Fal</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">⭐</div>
      <div class="nav-label">Burçlar</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">🃏</div>
      <div class="nav-label">Tarot</div>
    </div>
    <div class="nav-item">
      <div class="nav-icon">👤</div>
      <div class="nav-label">Profil</div>
    </div>
  </div>
</div>

<script>
  // STARS
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      animation-duration:${2+Math.random()*3}s;
      animation-delay:${Math.random()*3}s;
    `;
    starsEl.appendChild(s);
  }

  // PARTICLES
  const particlesEl = document.getElementById('particles');
  const colors = ['#25f4ee','#fe2c55','#a855f7','#fbbf24'];
  for (let i = 0; i < 15; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${6+Math.random()*8}s;
      animation-delay:${Math.random()*6}s;
    `;
    particlesEl.appendChild(p);
  }

  // PUSHER - Gerçek zamanlı bağlantı
  const pusher = new Pusher('85873b881a89291cfb09', { cluster: 'eu' });
  const channel = pusher.subscribe('tikfalai-channel');
  channel.bind('new-reply', function(data) {
    hideTyping();
    addMessage(data.message, false);
    isWaiting = false;
    document.getElementById('sendBtn').disabled = false;
  });

  // STATE
  let selectedFal = 'genel';
  let isWaiting = false;
  const WEBHOOK_URL = 'https://hook.eu1.make.com/s5bapcu3rcitjpi79c9gdg1vzsgxdyw2';

  const falLabels = {
    genel: 'Genel Fal', tarot: 'Tarot', astro: 'Astroloji',
    kahve: 'Kahve Falı', ask: 'Aşk Falı', para: 'Para Falı'
  };

  function selectFal(btn, type) {
    document.querySelectorAll('.fal-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedFal = type;
  }

  function getTime() {
    return new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(text, isUser) {
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = `msg-row ${isUser ? 'user' : ''}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${isUser ? 'user-av' : ''}`;
    avatar.textContent = isUser ? '👤' : '🔮';

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    const name = document.createElement('div');
    name.className = 'sender-name';
    name.textContent = isUser ? 'Sen' : 'TikFalAi';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${isUser ? 'user' : 'ai'}`;
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className = 'bubble-time';
    time.textContent = getTime();

    wrap.appendChild(name);
    wrap.appendChild(bubble);
    wrap.appendChild(time);
    row.appendChild(avatar);
    row.appendChild(wrap);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typingRow';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🔮';

    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

    row.appendChild(avatar);
    row.appendChild(bubble);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById('typingRow');
    if (t) t.remove();
  }

  async function sendMessage() {
    if (isWaiting) return;
    const field = document.getElementById('inputField');
    const text = field.value.trim();
    if (!text) return;

    field.value = '';
    field.style.height = 'auto';
    addMessage(text, true);

    isWaiting = true;
    document.getElementById('sendBtn').disabled = true;
    showTyping();

    try {
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          falType: falLabels[selectedFal],
          timestamp: new Date().toISOString()
        })
      });

      setTimeout(() => {
        hideTyping();
        addMessage('✨ Mesajın falcıya iletildi! Cevap hazırlanıyor, birazdan gelecek...', false);
        isWaiting = false;
        document.getElementById('sendBtn').disabled = false;
      }, 1500);

    } catch (e) {
      hideTyping();
      addMessage('Bağlantı hatası. Lütfen tekrar dene. 🌙', false);
      isWaiting = false;
      document.getElementById('sendBtn').disabled = false;
    }
  }

  function sendQuick(btn) {
    const field = document.getElementById('inputField');
    field.value = btn.textContent;
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 80) + 'px';
  }
</script>
</body>
</html>
